[project]
name = "svg-fractals"
version = "0.1.0"
description = "Generate SVG artwork from classic space-filling fractals."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "svgwrite>=1.4.3",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
